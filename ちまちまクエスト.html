<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ちまちまクエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fdf6e9;color:#4a3b2a;font-family:"DotGothic16","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input[type=text]{font:inherit;padding:9px 11px;border-radius:10px;border:2px solid #ecdcc2;background:#fffdf8;min-width:0}
input[type=text]:focus{outline:none;border-color:#f0a35a}
/* タイトル */
#title{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
h1{margin:4px 0 0;font-size:30px;text-align:center;color:#e07a2b;letter-spacing:.06em;text-shadow:0 3px 0 #ffe2b8}
.sub{text-align:center;font-size:13px;margin:2px 0 12px;color:#9a8466}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 3px 0 #efe0c6}
.card h2{margin:0 0 10px;font-size:15px;color:#b0651f}
.makeRow{display:flex;gap:12px;align-items:flex-start}
#prev{flex:none;width:110px;height:130px;image-rendering:pixelated;background:radial-gradient(circle at 50% 70%,#fff3dc,#ffe4c0);border-radius:14px}
.makeCol{flex:1;min-width:0}
.makeCol input{width:100%;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{padding:6px 10px;border-radius:999px;background:#fff6e8;border:2px solid #efe0c6;font-size:13px}
.chip.on{background:#ffe4c0;border-color:#e07a2b;font-weight:bold}
.sws{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.sw{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 2px #efe0c6;border:2px solid #fff}
.sw.on{box-shadow:0 0 0 3px #e07a2b}
.lbl{font-size:12px;color:#9a8466;margin:2px 0 4px}
.btn{background:#f0a35a;color:#fff;border-radius:14px;padding:12px;font-weight:bold;box-shadow:0 3px 0 #c97a34;font-size:15px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c97a34}
.btn.alt{background:#7cb8d9;box-shadow:0 3px 0 #4f8db0}
.btn.green{background:#6cbf7a;box-shadow:0 3px 0 #469656}
.btn.gray{background:#b9a990;box-shadow:0 3px 0 #8f8068}
.btn:disabled{opacity:.45}
.joinrow{display:flex;gap:8px;margin-top:8px}
.joinrow input{flex:1}
.roomItem{display:flex;justify-content:space-between;align-items:center;background:#f3f9fc;border-radius:10px;padding:8px 10px;font-size:14px}
.roomItem .btn{padding:6px 12px;font-size:13px}
.muted{font-size:12px;color:#9a8466;line-height:1.55}
#netState{font-size:12px;text-align:center;color:#9a8466;margin-top:8px}
.statline{font-size:13px;margin-top:4px}
.statline b{color:#e07a2b}
/* ゲーム */
#game{position:fixed;inset:0;background:#2a2433;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#game[hidden]{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));background:rgba(40,30,50,.62);color:#fff;border-radius:14px;padding:8px 10px;width:min(190px,calc(100vw - 150px));pointer-events:none}
#hud .nm{font-size:13px;display:flex;justify-content:space-between;gap:6px;white-space:nowrap}#hud .nm span:first-child{overflow:hidden;text-overflow:ellipsis}
.bar{height:9px;border-radius:5px;background:rgba(0,0,0,.4);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#6ad17a;border-radius:5px}
.bar.xp{height:5px}.bar.xp i{background:#ffd84a}
#hud .sm{font-size:11px;margin-top:3px;opacity:.9;display:flex;justify-content:space-between}
#topR{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mapName{background:rgba(40,30,50,.62);color:#ffe7a8;border-radius:12px;padding:5px 10px;font-size:13px;font-weight:bold}
.tbtns{display:flex;gap:6px}
.tb{background:rgba(255,248,232,.95);color:#5a3e2b;border-radius:12px;padding:7px 10px;font-size:13px;font-weight:bold;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#party{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.pm{background:rgba(40,30,50,.55);color:#fff;border-radius:8px;padding:3px 7px;font-size:11px;min-width:110px}
.pm .bar{height:4px;margin-top:2px}
#skillBtn{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px));width:78px;height:78px;border-radius:50%;background:#6a8cff;color:#fff;font-weight:bold;font-size:14px;box-shadow:0 4px 0 #3f5fc7;overflow:hidden;touch-action:none}
#potBtn{position:absolute;right:max(27px,calc(env(safe-area-inset-right) + 11px));bottom:max(108px,calc(env(safe-area-inset-bottom) + 100px));width:56px;height:56px;border-radius:50%;background:#ff7a8a;color:#fff;font-weight:bold;font-size:11px;box-shadow:0 3px 0 #c74a5a;overflow:hidden;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
#potBtn .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);pointer-events:none}#potBtn span,#potBtn b{position:relative}
.rb{position:relative}.dot{position:absolute;right:4px;top:4px;width:13px;height:13px;border-radius:50%;background:#ff4a5a;border:2px solid #fff}.dot[hidden]{display:none}
.it .lv{position:absolute;left:3px;top:1px;font-size:9px;font-weight:bold;color:#9a8466}
.it .n.top{top:1px;bottom:auto}
.slot.sel{outline:3px solid #e07a2b}
.num{width:110px;font:inherit;padding:6px 9px;border-radius:10px;border:2px solid #ecdcc2;background:#fffdf8}
#loginBox:empty{display:none}
.cap{font-size:12px;color:#9a8466;margin:2px 0 6px}
.lrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:6px}
.lrow canvas{flex:none;width:44px;height:44px;image-rendering:pixelated}.lrow .tx{flex:1;min-width:0;font-size:13px}.lrow .btn{padding:8px 10px;font-size:13px;flex:none}
.lrow.cur{outline:2px solid #e07a2b}
.need{font-size:13px;display:flex;align-items:center;gap:6px;margin:3px 0}.need canvas{width:26px;height:26px;image-rendering:pixelated}.need.ng b{color:#d64545}.need.ok b{color:#469656}
.srow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:6px 10px;margin-top:6px;font-size:14px}.srow .nm{width:72px;font-weight:bold}.srow .v{flex:1}.srow .v b{color:#e07a2b;font-size:16px}.srow .btn{padding:6px 16px}
.sdesc{font-size:11px;color:#9a8466;margin:2px 4px 0}
.mapCard.locked{background:#b9b0a4;opacity:.7}
#skillBtn .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);pointer-events:none}
#skillBtn span{position:relative}
#botL{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px));display:flex;gap:10px}
.rb{width:62px;height:62px;border-radius:50%;background:rgba(255,248,232,.95);color:#5a3e2b;font-weight:bold;font-size:12px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
#chatBar{position:absolute;left:0;right:100px;bottom:max(96px,calc(env(safe-area-inset-bottom) + 88px));display:flex;gap:6px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
#chatBar::-webkit-scrollbar{display:none}
#chatBar[hidden]{display:none}
#chatBar button{flex:none;background:#fff3d6;color:#5a3e2b;border-radius:14px;padding:7px 11px;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#chatBar input{flex:none;width:160px;padding:7px 10px;font-size:13px;border-radius:14px;border:none}
#modal{position:absolute;inset:0;background:rgba(30,20,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#modal[hidden]{display:none}
.panel{background:#fffaf0;width:100%;max-width:560px;max-height:88%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;font-weight:bold;color:#b0651f}
.ph button{font-size:22px;line-height:1;padding:2px 8px;color:#9a8466}
.pbody{overflow-y:auto;padding:0 14px calc(16px + env(safe-area-inset-bottom))}
.pv{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.pv canvas{flex:none;image-rendering:pixelated;width:96px;height:112px;background:radial-gradient(circle at 50% 70%,#fff3dc,#ffe4c0);border-radius:14px}
.pv .st{font-size:13px;line-height:1.7}
.pv .st b{color:#e07a2b}
.slots{display:flex;gap:6px;margin-bottom:10px}
.slot{flex:1;background:#fff;border:2px solid #efe0c6;border-radius:12px;padding:3px;display:flex;flex-direction:column;align-items:center;font-size:10px;color:#9a8466}
.slot canvas{width:44px;height:44px;image-rendering:pixelated}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.it{position:relative;background:#fff;border-radius:12px;border:2px solid #ddd;padding:2px;display:flex;justify-content:center}
.it canvas{width:52px;height:52px;image-rendering:pixelated}
.it.sel{outline:3px solid #e07a2b}
.it .n{position:absolute;right:3px;bottom:1px;font-size:10px;font-weight:bold;color:#7a6650}
.it .e{position:absolute;left:3px;top:1px;font-size:10px;font-weight:bold;color:#fff;background:#e07a2b;border-radius:6px;padding:0 4px}
.it .pr{position:absolute;left:0;right:0;bottom:-1px;font-size:10px;text-align:center;color:#7a6650;background:rgba(255,255,255,.85);border-radius:0 0 10px 10px}
.mapCard{display:block;width:100%;text-align:left;border-radius:16px;padding:10px 12px;margin-bottom:8px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mapCard .mt{font-size:17px;display:flex;justify-content:space-between;align-items:center}
.mapCard .rec{font-size:12px;background:rgba(0,0,0,.25);border-radius:8px;padding:2px 7px}.mapCard .rec.hard{background:#d64545}
.mapCard .md{font-size:12px;opacity:.92;margin-top:3px}.mapCard .mm{display:flex;gap:8px;align-items:flex-end;margin-top:6px}.mapCard .mm canvas{image-rendering:pixelated}
.mapCard .mf{font-size:12px;margin-top:4px;background:rgba(255,255,255,.22);border-radius:8px;padding:2px 7px;display:inline-block}
.theme-grass{background:#6fb84f}.theme-forest{background:#3f7f45}.theme-cave{background:#5a4f78}.theme-boss{background:#7a3f35}
.detail{background:#fff;border-radius:14px;padding:10px 12px;margin:10px 0;font-size:13px;min-height:64px}
.detail .t{font-weight:bold;font-size:15px}
.detail .acts{display:flex;gap:8px;margin-top:8px}
.detail .acts .btn{flex:1;padding:9px;font-size:14px}
#toast{position:fixed;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 56px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:9}
.tst{background:rgba(60,45,35,.92);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;max-width:88vw;text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
</style>
</head>
<body>

<div id="title">
  <h1>ちまちまクエスト</h1>
  <p class="sub">タップで走って、ちまちま冒険しよう</p>
  <div class="card">
    <h2>キャラクター</h2>
    <div class="makeRow">
      <canvas id="prev" width="220" height="260"></canvas>
      <div class="makeCol">
        <input type="text" id="nameIn" maxlength="10" placeholder="なまえ">
        <div class="lbl" id="jobLbl">しょくぎょう（さいしょだけ選べる）</div><div class="chips" id="jobChips"></div>
      </div>
    </div>
    <div class="statline" id="tStats"></div>
  </div>
  <div class="card">
    <h2>あそぶ</h2>
    <button class="btn" id="soloBtn" style="width:100%">はじめる</button>
    <div id="loginBox" class="joinrow"></div>
    <div id="netState">接続を確認中…</div>
  </div>
  <p class="muted">村のバザーでは、ほかの人と素材や装備を売り買いできるよ（ログインが必要）。<br>あそびかた：行きたい場所をタップすると走ります。押したまま引っぱると、その方向に走りつづけます。敵をタップすると近づいて自動でこうげき。右下のボタンでスキル。<br>パソコンなら矢印キーで移動、スペースでスキルも使えます。</p>
  <p class="muted" id="saveNote"></p>
</div>

<div id="game" hidden>
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="nm"><span id="hName"></span><span id="hLv"></span></div>
    <div class="bar"><i id="hHp"></i></div>
    <div class="sm"><span id="hHpT"></span><span id="hGold"></span></div>
    <div class="bar xp"><i id="hXp"></i></div>
  </div>
  <div id="topR">
    <div id="mapName"></div>
    <button class="tb" id="exitBtn">おわる</button>
    <div id="party"></div>
  </div>
  <div id="botL"><button class="rb" id="bagBtn">バッグ</button><button class="rb" id="stBtn">つよさ<i class="dot" id="stDot" hidden></i></button></div>
  <button id="potBtn"><div class="cd" id="potCd"></div><span>くすり</span><b id="potN">×0</b></button>
  <button id="skillBtn"><div class="cd" id="sklCd"></div><span id="sklName">スキル</span></button>
  <div id="chatBar" hidden></div>
  <div id="modal" hidden><div class="panel"><div class="ph"><span id="mTitle"></span><button id="mClose" aria-label="とじる">×</button></div><div class="pbody" id="mBody"></div></div></div>
</div>
<div id="toast"></div>

<script>

// =====================================================================

// =====================================================================
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const ch of s)h=Math.imul(h^ch.charCodeAt(0),16777619);return h>>>0}
function cleanText(t,n){return String(t==null?'':t).replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁠-⁯﻿]/g,'').slice(0,n)}

function shade(hex,k){if(!hex||hex[0]!=='#')return hex;const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(k<0){r*=1+k;g*=1+k;b*=1+k}else{r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k}return'rgb('+(r|0)+','+(g|0)+','+(b|0)+')'}

const JOBS={

  archer:{name:'アーチャー',hpM:6,range:340,cd:.55,shot:'arrow',scd:6,skill:'3連射',mag:false,body:{design:'hoodie',color:'#6b9f5a'},wpn:'bow',wn:'ゆみ'}
};
// ---- ステータス ----
// 振ったポイント×倍率＋装備。HP＝職業の倍率(hpM)×(10＋防御ポイント)
const STATS=['atk','mat','def','spd','luk'];

const STATDESC={atk:'ふつうの攻撃・回転斬り・3連射のダメージ',mat:'メテオ・メイジとヒーラーの攻撃・ヒールの回復量',def:'受けるダメージが減る。HPも増える',spd:'走る速さと攻撃の速さ（1につき+1%、上限+50%）',luk:'クリティカル（1につき+0.5%）とレア素材の出やすさ'};

const HAIR='short',HC='#7a5236';   // 髪型・髪色はいまは変えられない

// ---- 装備：ぶき・たて・あたま・せなか・くつ ----
// lv＝装備できるレベル。base＝作るのに使う下の装備、m＝素材、g＝ゴールド
const ITEMS={},ITEM_LIST=[];
const SLOTS=['weapon','shield','head','back','feet'];

const TIER_COL=['#9aa3ad','#4cbf5c','#3a8ee6','#e6a400'];
function defItem(o){const it=Object.assign({atk:0,mat:0,def:0,spd:0,luk:0,base:null,m:{},g:0,tier:0,job:null},o);ITEMS[it.id]=it;ITEM_LIST.push(it);return it}
defItem({id:'s_puni',slot:'shield',design:'round',name:'ぷにぷにの盾',color:'#5fd0bd',lv:1,def:4,m:{m_puni_n:8},g:60});
defItem({id:'s_drop',slot:'shield',design:'drop',name:'しずくの盾',color:'#8fe8ff',lv:5,tier:1,def:9,base:'s_puni',m:{m_puni_r:2,m_puni_n:5},g:130});
defItem({id:'s_jelly',slot:'shield',design:'big',name:'ゼリーの大盾',color:'#2f9e8c',lv:10,tier:2,def:16,base:'s_drop',m:{m_puniking_n:2,m_puni_n:10},g:420});

defItem({id:'k_small',slot:'back',design:'smallwing',name:'ちいさな羽',color:'#ffe066',lv:1,spd:3,luk:1,m:{m_pyoko_n:8,m_puni_n:2},g:115});
defItem({id:'k_gold',slot:'back',design:'midwing',name:'ひよこの翼',color:'#ffe066',lv:5,tier:1,spd:6,luk:3,base:'k_small',m:{m_pyoko_r:2,m_pyoko_n:10},g:220});

function segD(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;const t=l?clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1):0;return Math.hypot(px-ax-dx*t,py-ay-dy*t)}
function pathD(M,x,y){const P=M.path;let d=1e9;if(P)for(let i=0;i<P.length-1;i++)d=Math.min(d,segD(x,y,P[i][0],P[i][1],P[i+1][0],P[i+1][1]));return d}
function pondE(M,x,y,pad){let e=1e9;for(const[cx,cy,rx,ry]of M.ponds||[]){const dx=(x-cx)/(rx+(pad||0)),dy=(y-cy)/(ry+(pad||0));e=Math.min(e,dx*dx+dy*dy)}return e}
function blockedAt(M,x,y,r){if(pathD(M,x,y)<PATH_W+r)return true;if(pondE(M,x,y,r+20)<1)return true;const A=M.arena;return!!(A&&dist(x,y,A.x,A.y)<A.r+r+10)}

function defOf(id){return ITEMS[id]||MATS[id]||CONS[id]||null}
function kindOf(id){return ITEMS[id]?'eq':MATS[id]?'mat':CONS[id]?'con':null}
function sellOf(id){if(ITEMS[id])return Math.floor(ITEMS[id].g*.3);const d=defOf(id);return d?(d.sell!=null?d.sell:d.price):0}
function canAdd(box,id,n,kinds,max){const have=box[id]||0;if(!have&&Object.keys(box).length>=kinds)return 0;return Math.max(0,Math.min(n,max-have))}
function addTo(box,id,n,kinds,max){const k=canAdd(box,id,n,kinds,max);if(k>0)box[id]=(box[id]||0)+k;return k}
function takeFrom(box,id,n){const k=Math.min(n,box[id]||0);if(k>0){box[id]-=k;if(box[id]<=0)delete box[id]}return k}
const bagAdd=(id,n)=>addTo(save.bag,id,n,BAG_KINDS,BAG_MAX),storeAdd=(id,n)=>addTo(save.store,id,n,STORE_KINDS,STORE_MAX);
function stash(id,n){let k=bagAdd(id,n);if(k<n)k+=storeAdd(id,n-k);return k}   // バッグ→いっぱいなら倉庫
function haveAll(id){return(save.bag[id]||0)+(save.store[id]||0)}

function freshJob(){const pt={};for(const k of STATS)pt[k]=BASE_PT;return{lv:1,xp:0,pt,free:0}}
function freshSave(){const jobs={};for(const j in JOBS)jobs[j]=freshJob();return{v:3,name:'',job:'fighter',started:false,gold:50,jobs,bag:{},store:{},eq:{}}}

function JS(s){s=s||save;return s.jobs[s.job]}

function clampSave(s){
  const o=freshSave();
  if(!s||typeof s!=='object'||s.v!==3)return o;
  if(typeof s.name==='string')o.name=cleanText(s.name,10);
  if(JOBS[s.job])o.job=s.job;o.started=!!s.started;
  const g=Number(s.gold);if(Number.isFinite(g)&&g>=0)o.gold=Math.min(Math.floor(g),9999999);
  if(s.jobs&&typeof s.jobs==='object')for(const j in JOBS){const a=s.jobs[j];if(!a||typeof a!=='object')continue;const J=o.jobs[j];
    J.lv=clamp(Math.floor(Number(a.lv))||1,1,99);J.xp=Math.max(0,Math.floor(Number(a.xp))||0);let used=0;
    if(a.pt&&typeof a.pt==='object')for(const k of STATS){J.pt[k]=Math.max(BASE_PT,Math.floor(Number(a.pt[k]))||BASE_PT);used+=J.pt[k]-BASE_PT}
    const total=(J.lv-1)*PT_PER_LV;if(used>total){for(const k of STATS)J.pt[k]=BASE_PT;used=0}J.free=total-used}
  const box=(src,kinds,max)=>{const out={};if(src&&typeof src==='object')for(const k in src){const n=Math.floor(Number(src[k]))||0;if(defOf(k)&&n>0&&Object.keys(out).length<kinds)out[k]=Math.min(n,max)}return out};
  o.bag=box(s.bag,BAG_KINDS,BAG_MAX);o.store=box(s.store,STORE_KINDS,STORE_MAX);
  if(s.eq&&typeof s.eq==='object')for(const sl of SLOTS){const it=ITEMS[s.eq[sl]];if(it&&it.slot===sl)o.eq[sl]=it.id}
  return o;
}
function progressOf(s){let p=s.started?1:0;for(const j in s.jobs){const J=s.jobs[j];p+=(J.lv-1)*1e6+J.xp}return p}
function canWear(it,s){s=s||save;return!!it&&it.lv<=JS(s).lv&&(!it.job||it.job===s.job)}
// いまの職業・レベルで着けられない装備を外して、バッグ（いっぱいなら倉庫）に入れる
function fixEquip(){const out=[];for(const sl of SLOTS){const it=ITEMS[save.eq[sl]];if(it&&!canWear(it)){delete save.eq[sl];stash(it.id,1);out.push(it.name)}}return out}

function saveLocal(){try{localStorage.setItem('chima3',JSON.stringify(save))}catch(e){}}
function queueSave(){saveLocal();if(NET.user&&!saveTimer)saveTimer=setTimeout(()=>{saveTimer=null;flushSave()},15000)}   // ネットへは15秒に1回まで
async function flushSave(){
  if(saveTimer){clearTimeout(saveTimer);saveTimer=null}saveLocal();if(!NET.user)return;
  if(saving){saveAgain=true;return}saving=true;
  try{await NET.writeSave(JSON.parse(JSON.stringify(save)))}catch(e){console.error(e)}
  saving=false;if(saveAgain){saveAgain=false;await flushSave()}
}

const PX=2,OUTC='#3a2733';
const SKIN='#ffdcbf',SKIN2='#efb895',EYE='#2b1d24',BLUSH='#ffa0b4';

const colCache=new Map();
function parseCol(v){let a=colCache.get(v);if(a)return a;const n=parseInt(v.slice(1,7),16);a=[n>>16,n>>8&255,n&255,v.length>7?parseInt(v.slice(7,9),16):255];colCache.set(v,a);return a}
function sh(hex,k){if(!hex||hex[0]!=='#')return hex;const n=parseInt(hex.slice(1,7),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(k<0){r*=1+k;g*=1+k;b*=1+k}else{r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k}const h=v=>('0'+Math.round(clamp(v,0,255)).toString(16)).slice(-2);return'#'+h(r)+h(g)+h(b)}
function shade(hex,k){return sh(hex,k)}
function Buf(w,h,ox,oy){this.w=w;this.h=h;this.ox=ox;this.oy=oy;this.d=new Array(w*h).fill(null)}
Buf.prototype.p=function(x,y,c){x=Math.round(x)+this.ox;y=Math.round(y)+this.oy;if(x<0||y<0||x>=this.w||y>=this.h||!c)return;this.d[y*this.w+x]=c};
Buf.prototype.r=function(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.p(x+i,y+j,typeof c==='function'?c(x+i,y+j):c)};
Buf.prototype.e=function(cx,cy,rx,ry,c,cond){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1&&(!cond||cond(x,y)))this.p(x,y,typeof c==='function'?c(x,y):c)}};
Buf.prototype.l=function(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx+dy,i=0;
  for(let n=0;n<200;n++){this.p(x0,y0,typeof c==='function'?c(i++):c);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx}if(e2<=dx){err+=dx;y0+=sy}}};
Buf.prototype.outline=function(col){const w=this.w,h=this.h,d=this.d,add=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(d[i])continue;if((x>0&&d[i-1])||(x<w-1&&d[i+1])||(y>0&&d[i-w])||(y<h-1&&d[i+w]))add.push(i)}for(const i of add)d[i]=col;return this};
Buf.prototype.canvas=function(white){const c=document.createElement('canvas');c.width=this.w;c.height=this.h;const x=c.getContext('2d');const im=x.createImageData(this.w,this.h);
  for(let i=0;i<this.d.length;i++){const v=this.d[i];if(!v)continue;const a=white?[255,255,255,parseCol(v)[3]]:parseCol(v);im.data[i*4]=a[0];im.data[i*4+1]=a[1];im.data[i*4+2]=a[2];im.data[i*4+3]=a[3]}x.putImageData(im,0,0);return c};
const SPR=new Map();
function cached(key,make){let c=SPR.get(key);if(c)return c;if(SPR.size>900)SPR.clear();c=make();SPR.set(key,c);return c}

function lookKey(a){return a.job+'|'+a.hair+'|'+a.hc+'|'+SLOTS.map(s=>(a.eq&&a.eq[s])||'').join(',')}
function charSprite(a,frame){return cached('c|'+lookKey(a)+'|'+frame,()=>paintChar(a,frame).outline(OUTC).canvas())}
function paintChar(a,frame){
  const B=new Buf(40,46,18,43);
  const it=s=>ITEMS[a.eq&&a.eq[s]]||null;
  const hat=it('head'),wpn=it('weapon'),back=it('back'),shield=it('shield'),feet=it('feet'),body=(JOBS[a.job]||JOBS.fighter).body;
  let bob=0,lA=0,lB=0,flap=0;const dead=frame==='d';
  if(frame==='i1')bob=1;
  if(frame[0]==='w'){const n=+frame[1];lA=[1,0,-1,0][n];lB=-lA;bob=n%2?-1:0;flap=n%2}
  const Y=v=>v+bob;
  if(back)backPx(B,back,bob,flap);
  hairBackPx(B,a.hair,a.hc,bob);
  const longB=body.design==='robe';
  if(!longB){B.r(-3+lA,-4,2,3,SKIN2);B.r(1+lB,-4,2,3,SKIN)}
  feetPx(B,feet,lA,lB,longB);
  B.r(-4,Y(-10),1,4,SKIN2);
  bodyPx(B,body,bob);
  if(shield)shieldPx(B,shield,-6,Y(-8));
  B.e(0,Y(-18),6.5,6.2,(x,y)=>x<=-5||y>=Y(-13)?SKIN2:SKIN);
  if(dead){for(const ex of[2,5]){B.p(ex-1,Y(-20),EYE);B.p(ex+1,Y(-20),EYE);B.p(ex,Y(-19),EYE);B.p(ex-1,Y(-18),EYE);B.p(ex+1,Y(-18),EYE)}}
  else{for(const ex of[2,5]){B.p(ex,Y(-19),EYE);B.p(ex,Y(-18),EYE)}B.p(1,Y(-16),BLUSH);B.p(6,Y(-16),BLUSH);B.p(4,Y(-15),'#c96a66')}
  hairFrontPx(B,a.hair,a.hc,bob);
  if(hat)hatPx(B,hat,bob);
  B.r(4,Y(-10),1,2,SKIN);
  if(wpn)weaponPx(B,wpn,frame,5,Y(-8));
  B.p(5,Y(-8),SKIN);B.p(4,Y(-8),SKIN);
  return B;
}
function hairBackPx(B,st,hc,bob){
  const hs=sh(hc,-.28),Y=v=>v+bob;

const GROUND={};

function groundCanvas(id){
  if(GROUND[id])return GROUND[id];
  const M=MAPS[id],gen=GEN[id],gw=Math.ceil(M.w/PX),gh=Math.ceil(M.h/PX),R=mulberry(hashStr(id+'g'));
  const c=document.createElement('canvas');c.width=gw;c.height=gh;const x=c.getContext('2d');const im=x.createImageData(gw,gh),D=im.data;
  const set=(px,py,hex)=>{px|=0;py|=0;if(px<0||py<0||px>=gw||py>=gh)return;const a=parseCol(hex),i=(py*gw+px)*4;D[i]=a[0];D[i+1]=a[1];D[i+2]=a[2];D[i+3]=255};
  const th=THEME[M.theme];

    const stone=(px,py)=>{const ok=(px%7===0)||(py%5===0&&px%2===0);set(px,py,ok?'#d2bf98':'#e6d6b4')};
    for(let py=0;py<gh;py++)for(let px=0;px<gw;px++){const dx=(px-cx)/125,dy=(py-cy)/85;if(dx*dx+dy*dy<1||(px>=350&&py>=260&&py<305)||(px>=310&&px<390&&(py<280||py>300)))stone(px,py)}}
  if(M.path||M.ponds||M.arena){const A=M.arena;
    for(let py=0;py<gh;py++)for(let px=0;px<gw;px++){const wx=px*PX,wy=py*PX;
      if(A){const d=dist(wx,wy,A.x,A.y);if(d<A.r)set(px,py,R()<.08?'#bfe69a':(d>A.r-60?'#a6dc80':'#b0e18b'))}
      const pd=pathD(M,wx,wy);if(pd<PATH_W)set(px,py,pd>PATH_W-5?'#bfa26a':(R()<.12?'#cdb27a':'#dcc48e'));
      const e=pondE(M,wx,wy);if(e<1.32)set(px,py,e>=1?(R()<.3?'#d8c890':'#e6d6a0'):e>.78?'#4f9fd6':(R()<.015?'#bfeaff':'#69bdea'))}}

      case'flower':set(px,py-1,d.c);set(px-1,py,d.c);set(px+1,py,d.c);set(px,py+1,d.c);set(px,py,'#ffd23f');break;
      case'fern':{const g='#3f8a3f';for(let i=0;i<3;i++){set(px-i,py-i,g);set(px+i,py-i,g)}set(px,py-1,g);break}

      case'puddle':for(let i=-7;i<=7;i++)for(let j=-3;j<=3;j++)if(i*i/49+j*j/9<1)set(px+i,py+j,j<0?'#6a7ea8':'#5d6f98');break;

const GEN={};
function genMap(id){
  if(GEN[id])return GEN[id];
  const M=MAPS[id],R=mulberry(hashStr(id+'v2'));const props=[],deco=[],obs=[];
  const keep=[...M.portals.map(p=>[p.x,p.y,120]),[M.spawn[0],M.spawn[1],110],...(M.npcs||[]).map(n=>[n.x,n.y,110])];

const NET={
  state:'off',user:null,fb:null,
  async init(){
    if(!FIREBASE_CONFIG){this.state='nocfg';return}
    try{const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
      const[a,au,fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
      const app=a.initializeApp(FIREBASE_CONFIG);this.fb={au,fs,auth:au.getAuth(app),db:fs.getFirestore(app)};this.state='ready';
      au.onAuthStateChanged(this.fb.auth,u=>{this.user=u?{uid:u.uid}:null;onAuthChange()});
    }catch(e){console.error(e);this.state='err'}
  },
  async login(){const{au,auth}=this.fb;await au.signInWithPopup(auth,new au.GoogleAuthProvider())},
  async logout(){await this.fb.au.signOut(this.fb.auth)},
  async loadSave(){const{fs,db}=this.fb;const s=await fs.getDoc(fs.doc(db,'users',this.user.uid));return s.exists()?s.data().save:null},
  async writeSave(sv){const{fs,db}=this.fb;await fs.setDoc(fs.doc(db,'users',this.user.uid),{save:sv,t:fs.serverTimestamp()})},
  _map(d){const x=d.data();return{id:d.id,seller:x.seller,sellerName:x.sellerName,item:x.item,n:x.n,price:x.price,status:x.status,created:x.created?x.created.toMillis():Date.now()}},
  async listOpen(){const{fs,db}=this.fb;const r=await fs.getDocs(fs.query(fs.collection(db,'listings'),fs.where('status','==','open'),fs.limit(150)));return r.docs.map(d=>this._map(d))},
  async listMine(){const{fs,db}=this.fb;const r=await fs.getDocs(fs.query(fs.collection(db,'listings'),fs.where('seller','==',this.user.uid),fs.limit(20)));return r.docs.map(d=>this._map(d))},
  async create(item,n,price,name){const{fs,db}=this.fb;await fs.addDoc(fs.collection(db,'listings'),{seller:this.user.uid,sellerName:name,item,n,price,status:'open',created:fs.serverTimestamp()})},
  // 買う：出品中のものだけ「売れた」に変える（同時に買おうとしても1人だけ成功する）
  async buy(id){const{fs,db}=this.fb,uid=this.user.uid;return fs.runTransaction(db,async tx=>{const ref=fs.doc(db,'listings',id);const s=await tx.get(ref);
    if(!s.exists())throw new Error('gone');const l=this._map(s);if(l.status!=='open'||expired(l))throw new Error('gone');if(l.seller===uid)throw new Error('mine');
    tx.update(ref,{status:'sold',buyer:uid,sold:fs.serverTimestamp()});return l})},
  // 出品者がかたづける：とりさげ・期限切れ（open）か、売上の受け取り（sold）
  async settle(id,want){const{fs,db}=this.fb;return fs.runTransaction(db,async tx=>{const ref=fs.doc(db,'listings',id);const s=await tx.get(ref);
    if(!s.exists())throw new Error('gone');const l=this._map(s);if(l.status!==want)throw new Error('changed');tx.delete(ref);return l})}
};

function pushOut(o,r,mapId){
  const M=MAPS[mapId],gen=GEN[mapId];
  for(const ob of gen.obs){
    if(ob.c){const dx=o.x-ob.x,dy=o.y-ob.y,d=Math.hypot(dx,dy),min=ob.r+r;if(d<min&&d>0.01){o.x=ob.x+dx/d*min;o.y=ob.y+dy/d*min}}
    else{const cx=clamp(o.x,ob.x,ob.x+ob.w),cy=clamp(o.y,ob.y,ob.y+ob.h),dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy);
      if(d<r){if(d>0.01){o.x=cx+dx/d*r;o.y=cy+dy/d*r}else{o.y=ob.y+ob.h+r}}}
  }
  o.x=clamp(o.x,20,M.w-20);o.y=clamp(o.y,56,M.h-10);
}

  // キーボード
  let kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),ky=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  if(kx||ky){m.tgt=null;m.npc=null;m.tx=m.x+kx*60;m.ty=m.y+ky*60}
  let goal=null;
  if(m.tgt!=null){const mo=G.view.mons.get(m.tgt);if(!mo||mo.hp<=0||mo.dead){m.tgt=nextTarget(180)}}
  if(m.tgt!=null){const mo=G.view.mons.get(m.tgt),T=MON[mo.t];const rng=J.range+T.r;const d=dist(m.x,m.y,mo.dx,mo.dy);
    if(d>rng)goal={x:mo.dx,y:mo.dy};else{m.f=mo.dx<m.x?-1:1;if(m.acd<=0){m.acd=J.cd/spdMul(m.st);basicAttack(mo)}}}
  else if(m.npc){const n=m.npc;if(dist(m.x,m.y,n.x,n.y)<52){openNpc(n);m.npc=null;m.tx=m.x;m.ty=m.y}else goal={x:n.x,y:n.y+20}}
  else goal={x:m.tx,y:m.ty};
  m.walk=false;
  if(goal){const dx=goal.x-m.x,dy=goal.y-m.y,d=Math.hypot(dx,dy);if(d>3){const sp=250*spdMul(m.st),st=Math.min(d,sp*dt);const ox=m.x,oy=m.y;m.x+=dx/d*st;m.y+=dy/d*st;if(Math.abs(dx)>2)m.f=dx<0?-1:1;
    pushOut(m,12,G.map);m.walk=Math.hypot(m.x-ox,m.y-oy)>st*.3;if(!m.walk&&m.tgt==null&&!m.npc){m.tx=m.x;m.ty=m.y}

function decideHost(){
  if(MAPS[G.map].safe){G.amHost=false;G.hostPeer=null;return}
  if(!cur){becomeHost();return}
  const act=activePeers(),me=act.find(p=>p.sameTab);
  const others=act.filter(p=>!p.sameTab&&p.presence.mp===G.map);
  const byPeer=(a,b)=>a.peer<b.peer?-1:1;
  const claimers=others.filter(p=>p.presence.h).sort(byPeer);
  if(G.joinGrace>0||G.resumeGrace>0||document.hidden){G.amHost=false;G.hostPeer=claimers[0]||null;return}
  let pool=claimers.slice();if(G.amHost&&me)pool.push(me);
  if(!pool.length){pool=others.slice();if(me)pool.push(me);else{becomeHost();return}}
  pool.sort(byPeer);const h=pool[0];
  if(h.sameTab)becomeHost();else{G.amHost=false;G.hostPeer=h}
}
function becomeHost(){
  if(G.amHost)return;G.amHost=true;G.hostPeer=null;const Hs=G.H;Hs.mons=[];Hs.pend=[];

      Hs.mons.push({id,t,x,y,hx:x,hy:y,mhp,base:mhp-hp,start:snapshotDmg(id),seen:{},f,st:0,stT:3,ag:!!ag,atk,wt:0,wx:x,wy:y})}
    Hs.ko=L.ko.slice();Hs.nextId=Math.max(mx,...Hs.ko.map(k=>k[0]),L.n|0)+1}
  else{Hs.ko=[];Hs.nextId=Math.floor(Math.random()*9e8)+1e6;for(const[t,n]of MAPS[G.map].mons)for(let i=0;i<n;i++)spawnMon(t)}
}
function snapshotDmg(id){const o={},key='m'+id;if(cur)for(const p of cur.peers()){const d=p.presence&&p.presence.d;o[p.peer]=p.sameTab?(G.dmg[key]||0):(d&&Number(d[key]))||0}else o._me=G.dmg[key]||0;return o}
function playersHere(){const a=[];const m=G.me;if(m.dead<=0)a.push({x:m.x,y:m.y});for(const o of G.others.values())if(!o.dead)a.push({x:o.x,y:o.y});return a}
function spawnMon(t){
  const M=MAPS[G.map],T=MON[t];let x=0,y=0;const ent=M.mons.find(e=>e[0]===t),zone=ent&&ent[2];
  for(let i=0;i<30;i++){

    else{x=zone?rand(zone[0],zone[1]):rand(160,M.w-60);y=rand(110,M.h-40)}
    const tmp={x,y};pushOut(tmp,T.r,G.map);x=tmp.x;y=tmp.y;if(T.boss)break;
    if(M.arena&&dist(x,y,M.arena.x,M.arena.y)<M.arena.r+60)continue;
    if(dist(x,y,M.spawn[0],M.spawn[1])>260&&playersHere().every(p=>dist(p.x,p.y,x,y)>200))break}

function hostUpdate(dt){
  const M=MAPS[G.map],Hs=G.H;const peersNow=cur?cur.peers():[];

  for(const mo of Hs.mons){const T=MON[mo.t];let near=null,nd=1e9;for(const p of tg){const d=dist(p.x,p.y,mo.x,mo.y);if(d<nd){nd=d;near=p}}

    if(T.boss){mo.stT-=dt;const hd=dist(mo.x,mo.y,mo.hx,mo.hy);

    else if(agg){if(nd>18){mo.x+=(near.x-mo.x)/nd*T.spd*dt;mo.y+=(near.y-mo.y)/nd*T.spd*dt}mo.f=near.x<mo.x?-1:1}

function hostSnapshot(){const Hs=G.H;const L=[...Hs.mons.filter(m=>MON[m.t].boss),...Hs.mons.filter(m=>!MON[m.t].boss)];return{mp:G.map,m:L.slice(0,24).map(m=>[m.id,MTYPES.indexOf(m.t),Math.round(m.x),Math.round(m.y),Math.max(0,Math.round(m.hp)),m.mhp,m.f,m.st,m.ag?1:0,m.atk]),ko:Hs.ko,n:Hs.nextId}}

function recipeList(){return ITEM_LIST.filter(it=>it.slot===modalFilter&&(!it.job||it.job===save.job))}
function baseHave(it){if(!it.base)return true;return haveAll(it.base)>0||save.eq[ITEMS[it.base].slot]===it.base}
function canCraft(it){if(save.gold<it.g||!baseHave(it))return false;for(const k in it.m)if(haveAll(k)<it.m[k])return false;return true}
function takeAny(id,n){let k=takeFrom(save.bag,id,n);if(k<n)k+=takeFrom(save.store,id,n-k);return k}
function craft(it){
  if(!canCraft(it))return;let wasEq=false;
  if(it.base){if(haveAll(it.base)>0)takeAny(it.base,1);else{delete save.eq[ITEMS[it.base].slot];wasEq=true}}
  for(const k in it.m)takeAny(k,it.m[k]);save.gold-=it.g;
  if(wasEq&&canWear(it))save.eq[it.slot]=it.id;
  else if(!stash(it.id,1)){save.eq[it.slot]=save.eq[it.slot]||it.id}
  recalc();queueSave();toast('「'+it.name+'」ができた！'+(save.eq[it.slot]===it.id?'（そうびした）':''),'#ffe27a');renderModal()}

async function bzSell(id,n,price){

  if(G.fade>0){ctx.fillStyle='rgba(20,15,30,'+G.fade+')';ctx.fillRect(0,0,cv.width,cv.height)}
  const s=DPR;
  if(G.banner&&G.banner.life>0){ctx.globalAlpha=clamp(G.banner.life,0,1);ctx.fillStyle='rgba(40,30,50,.7)';ctx.fillRect(0,cv.height*.32,cv.width,44*s);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font=(22*s)+'px '+FONT;ctx.fillText(G.banner.t,cv.width/2,cv.height*.32+30*s);ctx.globalAlpha=1}
  if(m.dead>0){ctx.textAlign='center';ctx.font=(18*s)+'px '+FONT;ctx.fillStyle='#fff';ctx.fillText('村にもどるまで '+Math.ceil(m.dead)+' 秒',cv.width/2,cv.height*.6)}
  if(cur&&!G.amHost&&!G.hostPeer&&G.joinGrace>0&&!M.safe){ctx.textAlign='center';ctx.font=(14*s)+'px '+FONT;ctx.fillStyle='#fff';ctx.fillText('マップのようすを確認中…',cv.width/2,cv.height*.25)}
}
function drawMini(M){
  const s=DPR,w=Math.round(100*s),h=Math.round(w*M.h/M.w),x0=Math.round(8*s),y0=Math.round(86*s),k=w/M.w;
  ctx.save();ctx.globalAlpha=.88;ctx.fillStyle='#2a1e28';ctx.fillRect(x0-2*s,y0-2*s,w+4*s,h+4*s);
  ctx.imageSmoothingEnabled=true;ctx.drawImage(groundCanvas(G.map),x0,y0,w,h);ctx.imageSmoothingEnabled=false;ctx.globalAlpha=1;
  const dot=(x,y,c,r)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x0+x*k-r),Math.round(y0+y*k-r),Math.round(r*2),Math.round(r*2))};
  for(const p of M.portals)dot(p.x,p.y,'#7fd6ff',2.5*s);
  for(const mo of G.view.mons.values())if(!mo.dead){if(MON[mo.t].boss)dot(mo.dx,mo.dy,'#ff3a3a',3.5*s);else dot(mo.dx,mo.dy,'#ffb0a0',1*s)}
  for(const o of G.others.values())dot(o.x,o.y,'#ffffff',2.2*s);
  dot(G.me.x,G.me.y,'#ffe27a',2.6*s);
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=Math.max(1,s);ctx.strokeRect(x0+G.cam.x*k,y0+G.cam.y*k,Math.min(w,VW*k),Math.min(h,VH*k));
  ctx.restore();
}
const PROP_O={bush:[17,24],sign:[11,26],tree:[20,50],pine:[17,52],rock:[14,20],bigshroom:[19,40],crystal:[15,38],pillar:[15,64],house:[44,84],fountain:[37,44],stall:[24,38],lamp:[6,38]};
function updateHud(){
  const m=G.me;$('hName').textContent=save.name||'ぼうけんしゃ';const J=JS();$('hLv').textContent='Lv'+J.lv;
  $('hHp').style.width=clamp(m.hp/m.mhp*100,0,100)+'%';$('hHp').style.background=m.hp/m.mhp<.3?'#ff6a5a':'#6ad17a';$('hHpT').textContent='HP '+Math.ceil(m.hp)+'/'+m.mhp;$('hGold').textContent=save.gold+' G';
  $('hXp').style.width=clamp(J.xp/xpNeed(J.lv)*100,0,100)+'%';$('stDot').hidden=J.free<=0;$('potN').textContent='×'+(save.bag.c_potion||0);$('potCd').style.height=(m.pcd/POTION_CD*100)+'%';$('mapName').textContent=MAPS[G.map].name+(G.code?'　部屋 '+G.code.toUpperCase():'');
  $('sklCd').style.height=(m.scd/JOBS[save.job].scd*100)+'%';
  const party=$('party');party.innerHTML='';
  if(cur)for(const p of activePeers()){if(p.sameTab)continue;const q=p.presence;const d=document.createElement('div');d.className='pm';d.textContent=(cleanText(q.n,10)||'ぼうけんしゃ')+'　'+(MAPS[q.mp]?MAPS[q.mp].name:'');
    const b=document.createElement('div');b.className='bar';const i=document.createElement('i');i.style.width=clamp((Number(q.hp)||0)/Math.max(1,Number(q.mh)||1)*100,0,100)+'%';b.appendChild(i);d.appendChild(b);party.appendChild(d)}
}

// =====================================================================
// ループ
// =====================================================================
let last=performance.now();
const prevCtx=$('prev').getContext('2d');
function loop(now){
  requestAnimationFrame(loop);let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;const t=now/1000;
  if(!G){prevCtx.imageSmoothingEnabled=false;prevCtx.clearRect(0,0,220,260);const spr=charSprite(lookOf(save),Math.sin(t*.7)>.6?'w'+(Math.floor(t*9)%4):'i'+(Math.floor(t*1.7)%2));prevCtx.drawImage(spr,(220-spr.width*5)/2,250-spr.height*5,spr.width*5,spr.height*5);return}
  G.t+=dt;G.mapT+=dt;G.joinGrace=Math.max(0,G.joinGrace-dt);G.resumeGrace=Math.max(0,G.resumeGrace-dt);G.fade=Math.max(0,G.fade-dt*2.5);
  decideHost();syncOthers(dt);
  if(G.amHost)hostUpdate(dt);
  syncView(dt);updateMe(dt);updateShots(dt);
  for(const f of G.fx)f.life-=dt;G.fx=G.fx.filter(f=>f.life>0);
  for(const n of G.nums){n.life-=dt;n.y-=36*dt}G.nums=G.nums.filter(n=>n.life>0);
  if(G.banner)G.banner.life-=dt;if(G.tap)G.tap.life-=dt;
  sendPresence(dt);
  render(t);
  G.hudT-=dt;if(G.hudT<=0){G.hudT=.1;updateHud()}
  if(modalKind)drawPreviews(t);
}
requestAnimationFrame(loop);
loadLocal();renderTitle();NET.init().then(renderTitle);
